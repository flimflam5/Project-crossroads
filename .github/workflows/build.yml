name: CI

on:
  push:
    branches:
      - master
      - upcoming
      - feature/olivine-city-foundation
      - feature/joe-integration-01
      - feature/western-johto-01
      - feature/black-ledger-title-01
      - feature/ecruteak-connection-01
      - feature/olivine-detail-01
      - feature/western-area-completion-01
      - feature/title-music-01
      - feature/title-audio-cleanup-01
      - feature/boot-audio-refinement-01
      - feature/johto-exploration-network-01
      - feature/johto-visual-collision-01
      - feature/hgss-johto-gym-integration-01
      - feature/ecruteak-dependability-qa07
  pull_request:
  workflow_dispatch:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-emerald:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch immutable visual and player enum baselines
        run: git fetch --no-tags --depth=1 origin 9cd6a73717c1bfd124967b7e485740aa5b25d651 690485c9971965af7d1a9134d1ba81f148b880b2

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Emerald)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Crossroads regression checks
        run: |
          python3 crossroads/tools/build_johto_network.py --through west --check
          python3 crossroads/tools/validate_johto_network.py --built
          python3 crossroads/tools/validate_visual_repairs.py
          python3 crossroads/tools/build_eight_gym_integration.py --check
          python3 crossroads/tools/validate_eight_gyms.py
          python3 crossroads/tools/build_hgss_ecruteak_assets.py --check
          python3 crossroads/tools/build_hgss_ecruteak_assets.py --variant bell --check
          python3 crossroads/tools/hgss_ecruteak_terrain.py --check
          python3 crossroads/tools/validate_ecruteak_qa07.py
          python3 crossroads/tools/build_hgss_violet_assets.py --check
          python3 crossroads/tools/build_hgss_violet.py --check
          python3 crossroads/tools/validate_hgss_violet.py
          python3 crossroads/tools/check_mapjson_outputs.py
          python3 crossroads/tools/validate_black_ledger_intro.py
          python3 crossroads/tools/validate_title_music.py
          python3 crossroads/tools/validate_area_completion.py
          python3 crossroads/tools/validate_opening.py
          python3 crossroads/tools/validate_joe_special_assets.py
          python3 crossroads/tools/build_joe_special_assets.py --check
          python3 crossroads/tools/build_ecruteak_npc_assets.py --check
          python3 crossroads/tools/build_hgss_temple_assets.py --check
          python3 crossroads/tools/validate_joe_assets.py
          python3 crossroads/tools/validate_route39.py
          python3 crossroads/tools/validate_western_johto.py --built
          python3 crossroads/tools/build_western_johto_layouts.py --check
          python3 crossroads/tools/build_black_ledger_title.py --check
          python3 crossroads/tools/build_route39_layout.py --check
          python3 crossroads/tools/validate_olivine.py --built
          python3 crossroads/tools/validate_olivine_interiors.py
          python3 crossroads/tools/build_olivine_interiors.py --check
          python3 crossroads/tools/build_olivine_layout.py --check

      - name: Identify test build
        run: |
          python3 crossroads/tools/write_build_manifest.py

      - name: Upload playable Emerald ROM
        uses: actions/upload-artifact@v4
        with:
          name: black-ledger-ecruteak-qa07-${{ github.sha }}
          path: |
            pokeemerald.gba
            build-info.json
            crossroads/TESTING.md
            crossroads/STATUS.md
            crossroads/RELEASE_0_4.md
            crossroads/RELEASE_0_5.md
            crossroads/RELEASE_0_6.md
            crossroads/RELEASE_0_7.md
            crossroads/RELEASE_0_8.md
            crossroads/RELEASE_0_8_1.md
            crossroads/RELEASE_0_8_2.md
            crossroads/RELEASE_0_8_3.md
            crossroads/RELEASE_0_9.md
            crossroads/RELEASE_0_9_1.md
            crossroads/RELEASE_HGSS_QA05.md
            crossroads/RELEASE_HGSS_QA06.md
            crossroads/RELEASE_ECRUTEAK_QA07.md
            crossroads/hgss/ECRUTEAK_QA07.md
            crossroads/hgss/ECRUTEAK_QA07_TOPOLOGY.md
            crossroads/hgss/ecruteak-qa07-checklist.json
            crossroads/qa/ecruteak-qa07
            crossroads/hgss/VIOLET_QA06.md
            crossroads/hgss/REGION_CHECKLIST.md
            crossroads/hgss/ECRUTEAK_QA05.md
            crossroads/hgss/*-review.json
            crossroads/qa/visual-0.9.1
            crossroads/johto/manifest.json
            crossroads/johto/TOPOLOGY.md
            crossroads/johto/DELTA_QA.md
            crossroads/johto/coverage.json
          if-no-files-found: error
          retention-days: 14

  build-firered:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Firered)
        run: make firered -j$(nproc) -O

  build-leafgreen:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Leafgreen)
        run: make leafgreen -j$(nproc) -O

  release:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Release
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) release

  test:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-check-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Test
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: make -j$(nproc) check

  # Gate job: satisfies the "build" branch protection rule.
  # Passes only when all parallel build/test jobs succeed.
  build:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: [build-emerald, build-firered, build-leafgreen, release, test]
    steps:
      - name: All builds passed
        run: echo "All builds and tests passed."

  docs_validate:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that SUMMARY.md includes markdown doc files
        run: .github/docs_validate/inclusive_summary.py

  allcontributors:
    if: github.actor == 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Automatically pass for allcontributors
        run: echo "CI automatically passes for allcontributors" && exit 0
